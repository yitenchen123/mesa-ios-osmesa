name: build-ios-osmesa-zink

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zink-ios-arm64:
    name: Zink+OSMesa dylib (iOS device arm64, Metal via MoltenVK)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      IOS_MIN_VERSION: "14.0"
      ARCH: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools + MoltenVK headers
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install "meson>=1.4.0" ninja mako pyyaml packaging

          if ! command -v bison >/dev/null 2>&1 || ! bison --version 2>/dev/null | head -n1 | grep -qE '\b([3-9]|[1-9][0-9]+)\.'; then
            brew install bison
            echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          fi
          if ! command -v flex >/dev/null 2>&1; then
            brew install flex
            echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          fi
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi
          # MoltenVK headers are required to compile Zink on darwin/iOS.
          # Zink dlopens the Vulkan loader at runtime, so brew headers are
          # enough for the build; the iOS app must bundle MoltenVK XCFramework.
          if ! brew list molten-vk >/dev/null 2>&1; then
            brew install molten-vk
          fi
          echo "MOLTEN_VK_DIR=$(brew --prefix molten-vk)" >> "$GITHUB_ENV"
          ls -la "$(brew --prefix molten-vk)/include" | head -n 20

      - name: Select iPhoneOS SDK
        run: |
          set -eux
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version
          meson --version
          ninja --version
          bison --version | head -n1
          flex --version

      - name: Generate iOS cross file
        run: |
          set -eux
          cat > "$GITHUB_WORKSPACE/ios-arm64-cross.ini" <<EOF
          [binaries]
          c = ['clang', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          cpp = ['clang++', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          objc = ['clang', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          objcpp = ['clang++', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          ar = 'ar'
          strip = 'strip'
          nm = 'nm'
          objdump = 'objdump'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['/nonexistent']
          EOF
          cat "$GITHUB_WORKSPACE/ios-arm64-cross.ini"

      - name: Configure (meson setup, zink+softpipe+osmesa)
        run: |
          set -eux
          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/ios-arm64-cross.ini" \
            --buildtype=release \
            -Dosmesa=true \
            -Dgallium-drivers=zink,softpipe \
            -Dvulkan-drivers= \
            -Dvulkan-layers= \
            -Dplatforms= \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dopengl=true \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dmoltenvk-dir="$MOLTEN_VK_DIR" \
            -Dvulkan-loader-rpath=@loader_path \
            -Dexpat=disabled \
            -Dxmlconfig=disabled \
            -Dvalgrind=disabled \
            -Dzstd=disabled \
            -Ddisplay-info=disabled \
            -Dspirv-tools=disabled \
            -Dshader-cache=disabled \
            -Dteflon=false \
            -Dtorx=false \
            -Dtools= \
            -Dvideo-codecs= \
            -Dbuild-tests=false \
            -Denable-glcpp-tests=false \
            -Dbuild-radv-tests=false \
            -Dbuild-aco-tests=false \
            -Dxlib-lease=disabled \
            -Dlibunwind=disabled

      - name: Build (meson compile)
        run: meson compile -C build

      - name: Stage dylibs (OSMesa + Zink gallium)
        run: |
          set -eux
          mkdir -p dist
          # Zink+OSMesa 方案产物：仅 libOSMesa.8.dylib
          DIR=build/src/gallium/targets/osmesa
          if [ -e "$DIR/libOSMesa.8.dylib" ]; then
            cp -L "$DIR/libOSMesa.8.dylib" dist/libOSMesa.8.dylib
          elif [ -e "$DIR/libOSMesa.dylib" ]; then
            cp -L "$DIR/libOSMesa.dylib" dist/libOSMesa.8.dylib
          else
            echo "OSMesa dylib not found in $DIR"
            ls -la "$DIR" || true
            exit 1
          fi
          ls -la dist

      - name: Inspect artifacts
        run: |
          set -eux
          file dist/*.dylib || true
          for f in dist/*.dylib; do
            echo "===== $f ====="
            lipo -info "$f" || true
            otool -l "$f" | grep -A5 LC_BUILD_VERSION || true
          done
          echo "--- OSMesa symbols ---"
          nm -gU dist/libOSMesa.8.dylib | grep -E 'OSMesa' || true
          echo "--- Zink symbols (zink_screen_create etc) ---"
          for f in dist/*.dylib; do
            echo "-- $f --"
            nm -gU "$f" 2>/dev/null | grep -iE 'zink|_gl' | head -n 20 || true
          done
          echo "--- MoltenVK / Vulkan references ---"
          for f in dist/*.dylib; do
            otool -L "$f" || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libOSMesa.8.dylib
          path: dist/libOSMesa.8.dylib
          if-no-files-found: error
          retention-days: 30

  egl-ios-compile-check:
    name: EGL iOS platform compile check (Kopper P1)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      IOS_MIN_VERSION: "14.0"
      ARCH: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools + MoltenVK headers
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install "meson>=1.4.0" ninja mako pyyaml packaging

          if ! command -v bison >/dev/null 2>&1 || ! bison --version 2>/dev/null | head -n1 | grep -qE '\b([3-9]|[1-9][0-9]+)\.'; then
            brew install bison
            echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          fi
          if ! command -v flex >/dev/null 2>&1; then
            brew install flex
            echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          fi
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi
          if ! brew list molten-vk >/dev/null 2>&1; then
            brew install molten-vk
          fi
          echo "MOLTEN_VK_DIR=$(brew --prefix molten-vk)" >> "$GITHUB_ENV"

      - name: Select iPhoneOS SDK
        run: |
          set -eux
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
          xcodebuild -version
          clang --version
          meson --version
          ninja --version

      - name: Generate iOS cross file
        run: |
          set -eux
          cat > "$GITHUB_WORKSPACE/ios-arm64-cross.ini" <<EOF
          [binaries]
          c = ['clang', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          cpp = ['clang++', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          objc = ['clang', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          objcpp = ['clang++', '-target', 'arm64-apple-ios${IOS_MIN_VERSION}', '-isysroot', '${SDKROOT}']
          ar = 'ar'
          strip = 'strip'
          nm = 'nm'
          objdump = 'objdump'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          pkg_config_libdir = ['/nonexistent']
          EOF
          cat "$GITHUB_WORKSPACE/ios-arm64-cross.ini"

      - name: Configure (meson setup, egl+ios+zink)
        run: |
          set -eux
          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/ios-arm64-cross.ini" \
            --buildtype=release \
            -Dosmesa=true \
            -Dgallium-drivers=zink,softpipe \
            -Dvulkan-drivers= \
            -Dvulkan-layers= \
            -Dplatforms=ios \
            -Dglx=disabled \
            -Degl=enabled \
            -Dgbm=disabled \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dopengl=true \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dmoltenvk-dir="$MOLTEN_VK_DIR" \
            -Dvulkan-loader-rpath=@loader_path \
            -Dexpat=disabled \
            -Dxmlconfig=disabled \
            -Dvalgrind=disabled \
            -Dzstd=disabled \
            -Ddisplay-info=disabled \
            -Dspirv-tools=disabled \
            -Dshader-cache=disabled \
            -Dteflon=false \
            -Dtorx=false \
            -Dtools= \
            -Dvideo-codecs= \
            -Dbuild-tests=false \
            -Denable-glcpp-tests=false \
            -Dbuild-radv-tests=false \
            -Dbuild-aco-tests=false \
            -Dxlib-lease=disabled \
            -Dlibunwind=disabled

      - name: Build (meson compile)
        run: meson compile -C build

      - name: Stage EGL/Kopper dylibs
        run: |
          set -eux
          mkdir -p dist
          cp -L build/src/gallium/targets/dri/libgallium-26.3.0-devel.dylib dist/ || true
          EGL=build/src/egl/libEGL.dylib
          [ -e "$EGL" ] || EGL=build/src/egl/libEGL.1.dylib
          cp -L "$EGL" dist/libEGL.dylib

          # Build a self-contained entry dylib that re-exports BOTH the EGL
          # entry points and the gallium driver (which carries the GL
          # functions). The launcher hands this to LWJGL as
          # org.lwjgl.opengl.libname, and LWJGL resolves every gl* symbol with
          # dlsym on that one image -- libEGL alone exports egl* only, so
          # GL.createCapabilities() would fail with "Core OpenGL functions
          # could not be found". Mithril/MobileGL work because their dylibs are
          # self-contained the same way.
          GALLIUM=dist/libgallium-26.3.0-devel.dylib
          # Rename the plain EGL image to libEGL.1.dylib (its own install name)
          # so the merged image can take the libEGL.dylib slot. The launcher's
          # renderer preference already stores "libEGL.dylib", so the merged
          # image must live at that exact path - a new file name would be
          # ignored by existing profiles.
          mv dist/libEGL.dylib dist/libEGL.1.dylib
          if [ -e "$GALLIUM" ]; then
            xcrun -sdk iphoneos ld -dylib \
              -arch arm64 \
              -platform_version ios 14.0 18.0 \
              -install_name @rpath/libEGL.dylib \
              -reexport_library dist/libEGL.1.dylib \
              -reexport_library "$GALLIUM" \
              -o dist/libEGL.dylib || {
                echo "::warning::ld -reexport_library merge failed; shipping split dylibs"
                cp -L dist/libEGL.1.dylib dist/libEGL.dylib
              }
          fi
          ls -la dist

      - name: Verify EGL/Kopper artifacts
        run: |
          set -eux
          # Hard assertions: these must exist or the kopper bring-up is broken.
          test -e dist/libEGL.dylib
          test -e dist/libEGL.1.dylib
          test -e dist/libgallium-26.3.0-devel.dylib
          # The entry point must re-export BOTH families, or LWJGL cannot create
          # GL capabilities through the single image it is handed.
          echo "--- libEGL.dylib: re-exported dylibs ---"
          otool -L dist/libEGL.dylib | sed -n '2,6p'
          echo "--- libEGL.dylib: load commands ---"
          otool -l dist/libEGL.dylib | grep -A2 -E 'LC_REEXPORT_DYLIB' | head -20
          echo "--- driver contents ---"
          strings dist/libgallium-26.3.0-devel.dylib | grep -E 'VK_EXT_metal_surface|CreateMetalSurfaceEXT|kopper' | sort -u | head -n 20 || true
          echo "EGL/Kopper artifact verification passed"
          # Confirm the iOS platform object was really compiled into the driver.
          strings dist/libEGL.dylib | grep -E 'dri2_initialize_ios|EGL_EXT_platform_ios' | sort -u || true
          echo "EGL/Kopper artifact verification passed"

      - name: Upload EGL/Kopper dylibs
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ios-arm64-egl-kopper
          path: dist/*.dylib
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egl-ios-logs
          path: build/meson-logs/
          if-no-files-found: warn
          retention-days: 14
